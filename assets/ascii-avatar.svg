<style>
.l{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:7px;fill:#c9d1d9;white-space:pre;opacity:0;
   animation:reveal .35s ease-out forwards, scan 5s ease-in-out infinite}
@keyframes reveal{from{opacity:0}to{opacity:1}}
@keyframes scan{0%,18%,100%{fill:#c9d1d9}6%{fill:#ffffff}}
.cur{fill:#c9d1d9;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
</style>
